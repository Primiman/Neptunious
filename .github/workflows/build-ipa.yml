name: Build Neptunious IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project Neptunious.xcodeproj \
            -scheme Neptunious \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Neptunious.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA (unsigned, TrollStore-installable)
        run: |
          mkdir -p build/Payload
          cp -r build/Neptunious.xcarchive/Products/Applications/Neptunious.app build/Payload/
          cd build
          zip -r Neptunious.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neptunious-ipa
          path: build/Neptunious.ipa
